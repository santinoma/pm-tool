services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pmtool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmtool}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-pmtool_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-d` is required — without it, pg_isready defaults to a database named
      # after the user ("pmtool"), which doesn't exist (only ${PLATFORM_DB_NAME}
      # does), so the healthcheck fails forever and `app` never starts.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmtool} -d ${PLATFORM_DB_NAME:-pmtool_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # `.env` is optional — copy `.env.example` to `.env` to override defaults
    # (BASE_DOMAIN, POSTGRES_*, CADDY_HTTP_PORT, ...). `required: false` means
    # `docker compose up` still works on a fresh checkout with no `.env` at all.
    env_file:
      - path: .env
        required: false
    environment:
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-pmtool}:${POSTGRES_PASSWORD:-pmtool}@postgres:5432/${PLATFORM_DB_NAME:-pmtool_platform}
      UPLOADS_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads-data:/app/uploads
    ports:
      - "3000:3000"

  # Web UI to browse/query the Postgres data (both the platform DB and every
  # per-tenant DB, since they all live in the same `postgres` container) —
  # reachable at http://db.localhost once Caddy is up. Dev-only: never added
  # to docker-compose.prod.yml — a DB admin UI has no business being exposed
  # on a production host.
  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - adminer
    ports:
      # Overridable — some hosts already have something else bound to 80 (e.g. a system
      # nginx/apache), which otherwise makes `docker compose up` fail outright. Set
      # CADDY_HTTP_PORT in .env instead of editing this file if 80 is taken.
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  postgres-data:
  uploads-data:
