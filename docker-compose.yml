services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pmtool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmtool}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-pmtool_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmtool}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-pmtool}:${POSTGRES_PASSWORD:-pmtool}@postgres:5432/${PLATFORM_DB_NAME:-pmtool_platform}
      UPLOADS_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads-data:/app/uploads
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Overridable — some hosts already have something else bound to 80 (e.g. a system
      # nginx/apache), which otherwise makes `docker compose up` fail outright. Set
      # CADDY_HTTP_PORT in .env instead of editing this file if 80 is taken.
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  postgres-data:
  uploads-data:
